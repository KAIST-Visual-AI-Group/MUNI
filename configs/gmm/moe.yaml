# =============================================================================
# Gaussian-mixture benchmark — MMVAE (MoE) baseline
# MoEAggregator + ``one_any`` routing — each step encodes a single random
# modality and reconstructs a uniformly chosen target in {prior} ∪ available.
# Aggregator is a trivial pass-through under one_any (K=1).
# =============================================================================

base: base.yaml

model:
  routing:
    train_paths:
      one_any:      { weight: 1.0 }

    aggregator:
      adapter: "muni.modules.aggregation.MoEAggregator"
      params:
        modalities: ${model.routing.modalities}
        latent_dim: ${model.latent_dim}

checkpoint:
  output_dir: ./output/gmm/moe
