# =============================================================================
# Gaussian-mixture benchmark — HELVAE baseline
# HellingerAggregator + ``all_any`` routing — every step
# encodes the full available subset and reconstructs a uniformly chosen
# target in {prior} ∪ available.
# =============================================================================

base: base.yaml

model:
  routing:
    train_paths:
      all_any:     { weight: 1.0 }

    aggregator:
      adapter: "muni.modules.aggregation.HellingerAggregator"
      params:
        modalities: ${model.routing.modalities}
        latent_dim: ${model.latent_dim}

checkpoint:
  output_dir: ./output/gmm/helvae
