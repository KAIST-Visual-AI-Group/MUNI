# =============================================================================
# PolyMNIST × 5 modalities — HELVAE baseline.
# =============================================================================

base: base.yaml

model:
  routing:
    aggregator:
      adapter: "muni.modules.aggregation.HellingerAggregator"
      params:
        modalities: ${model.routing.modalities}
        latent_dim: ${model.latent_dim}

    train_paths:
      all_any:     { weight: 1.0 }

    prior:
      params:
        encoder_grad_scale: 0.1

checkpoint:
  output_dir: ./output/poly_mnist/helvae
