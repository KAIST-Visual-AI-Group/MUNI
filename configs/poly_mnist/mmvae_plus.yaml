# =============================================================================
# PolyMNIST × 5 modalities — MMVAE+ baseline (Palumbo, Daunhawer, Vogt — ICLR 2023)
# =============================================================================

base: base.yaml

model:
  latent_dim: 64                # = shared 32 + private 32 (per modality)

  modules:
    # Shared-only flow prior; ``token_dim`` overrides the inherited base value.
    prior_net:
      params:
        token_dim: 32

  routing:
    train_paths:
      one_any:      { weight: 1.0 }

    aggregator:
      adapter: "muni.modules.aggregation.MoEAggregator"
      params:
        modalities: ${model.routing.modalities}
        latent_dim: 32                   # shared_dim (attribute only)

    private_priors:
      kl_weight: 1.0   # β = 1 (standard MMVAE+ default)
      m0: &priv
        target: "muni.modules.private_prior.ModalityPrivatePrior"
        params: { dim: 32 }
      m1: *priv
      m2: *priv
      digit: *priv
      quadrant: *priv

    prior:
      params:
        encoder_grad_scale: 0.1

checkpoint:
  output_dir: ./output/poly_mnist/mmvae_plus
